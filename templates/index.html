<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
        }

        .navbar {
            background: #fff;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .navbar h2 {
            font-size: 18px;
            color: #1a1a2e;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-phone {
            font-size: 14px;
            color: #666;
        }

        .btn-logout {
            padding: 8px 16px;
            background: #ff4d4f;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-logout:hover {
            background: #cf1322;
        }

        .container {
            max-width: 800px;
            margin: 48px auto;
            padding: 0 24px;
        }

        .welcome-card {
            background: #fff;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .welcome-card h1 {
            font-size: 28px;
            color: #1a1a2e;
            margin-bottom: 12px;
        }

        .welcome-card p {
            font-size: 16px;
            color: #666;
            margin-bottom: 32px;
        }

        .user-info {
            background: #f9fafb;
            border-radius: 10px;
            padding: 24px;
            text-align: left;
        }

        .user-info h3 {
            font-size: 15px;
            color: #333;
            margin-bottom: 16px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-row .label {
            color: #888;
        }

        .info-row .value {
            color: #333;
            font-weight: 500;
        }

        .loading-text {
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h2>我的应用</h2>
        <div class="navbar-right">
            <span class="user-phone" id="navPhone"></span>
            <button class="btn-logout" onclick="logout()">退出登录</button>
        </div>
    </nav>

    <div class="container">
        <div class="welcome-card">
            <h1>登录成功</h1>
            <p>欢迎回来，您已通过手机号验证码认证</p>

            <div class="user-info">
                <h3>账户信息</h3>
                <div id="userInfo">
                    <p class="loading-text">加载中...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 加载用户信息
        async function loadUserInfo() {
            try {
                const resp = await fetch('/api/user-info');
                if (resp.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                const user = await resp.json();

                document.getElementById('navPhone').textContent = user.phone;
                document.getElementById('userInfo').innerHTML = `
                    <div class="info-row">
                        <span class="label">手机号</span>
                        <span class="value">${user.phone}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">注册时间</span>
                        <span class="value">${user.created_at}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">最近登录</span>
                        <span class="value">${user.last_login}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">登录次数</span>
                        <span class="value">${user.login_count} 次</span>
                    </div>
                `;
            } catch (err) {
                document.getElementById('userInfo').innerHTML =
                    '<p class="loading-text">加载失败，请刷新页面</p>';
            }
        }

        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
            } catch (e) {}
            window.location.href = '/login';
        }

        loadUserInfo();
    </script>
</body>
</html>
