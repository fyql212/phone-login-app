<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 手机号验证码</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-header h1 {
            font-size: 24px;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-row {
            display: flex;
            gap: 12px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .input-row input {
            flex: 1;
        }

        .btn-send-code {
            flex-shrink: 0;
            padding: 12px 20px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s, opacity 0.3s;
            white-space: nowrap;
        }

        .btn-send-code:hover:not(:disabled) {
            background: #5a6fd6;
        }

        .btn-send-code:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: #999;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 8px;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .message.error {
            display: block;
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #cf1322;
        }

        .message.success {
            display: block;
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #389e0d;
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #999;
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>欢迎登录</h1>
            <p>使用手机号验证码快速登录</p>
        </div>

        <form id="loginForm" onsubmit="return false;">
            <div class="form-group">
                <label for="phone">手机号</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="请输入11位手机号"
                       maxlength="11"
                       autocomplete="tel"
                       inputmode="numeric">
            </div>

            <div class="form-group">
                <label for="code">验证码</label>
                <div class="input-row">
                    <input type="text" id="code" name="code"
                           placeholder="请输入验证码"
                           maxlength="6"
                           autocomplete="one-time-code"
                           inputmode="numeric">
                    <button type="button" id="btnSendCode" class="btn-send-code" onclick="sendCode()">
                        获取验证码
                    </button>
                </div>
            </div>

            <button type="submit" id="btnLogin" class="btn-login" onclick="doLogin()">
                登 录
            </button>
        </form>

        <div id="message" class="message"></div>

        <div class="login-footer">
            未注册的手机号验证后将自动创建账号
        </div>
    </div>

    <script>
        let countdown = 0;
        let timer = null;

        // 只显示数字
        document.getElementById('phone').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
        });
        document.getElementById('code').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
        });

        // 回车触发
        document.getElementById('phone').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendCode();
        });
        document.getElementById('code').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doLogin();
        });

        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
        }

        function hideMessage() {
            document.getElementById('message').className = 'message';
        }

        function startCountdown(seconds) {
            countdown = seconds;
            const btn = document.getElementById('btnSendCode');
            btn.disabled = true;
            btn.textContent = countdown + 's 后重发';

            timer = setInterval(function() {
                countdown--;
                if (countdown <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.textContent = '获取验证码';
                } else {
                    btn.textContent = countdown + 's 后重发';
                }
            }, 1000);
        }

        async function sendCode() {
            const phone = document.getElementById('phone').value.trim();

            if (!/^1[3-9]\d{9}$/.test(phone)) {
                showMessage('请输入正确的11位手机号', 'error');
                return;
            }

            hideMessage();
            const btn = document.getElementById('btnSendCode');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>发送中';

            try {
                const resp = await fetch('/api/send-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phone })
                });

                const data = await resp.json();

                if (data.success) {
                    showMessage(data.message, 'success');
                    startCountdown(60);
                    document.getElementById('code').focus();
                } else {
                    showMessage(data.message, 'error');
                    btn.disabled = false;
                    btn.textContent = '获取验证码';
                }
            } catch (err) {
                showMessage('网络错误，请稍后重试', 'error');
                btn.disabled = false;
                btn.textContent = '获取验证码';
            }
        }

        async function doLogin() {
            const phone = document.getElementById('phone').value.trim();
            const code = document.getElementById('code').value.trim();

            if (!/^1[3-9]\d{9}$/.test(phone)) {
                showMessage('请输入正确的11位手机号', 'error');
                return;
            }
            if (!/^\d{6}$/.test(code)) {
                showMessage('请输入6位数字验证码', 'error');
                return;
            }

            hideMessage();
            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>登录中...';

            try {
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phone, code: code })
                });

                const data = await resp.json();

                if (data.success) {
                    showMessage('登录成功，正在跳转...', 'success');
                    setTimeout(function() {
                        window.location.href = data.redirect || '/';
                    }, 800);
                } else {
                    showMessage(data.message, 'error');
                    btn.disabled = false;
                    btn.textContent = '登 录';
                }
            } catch (err) {
                showMessage('网络错误，请稍后重试', 'error');
                btn.disabled = false;
                btn.textContent = '登 录';
            }
        }
    </script>
</body>
</html>
